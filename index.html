<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Limits what this page can load and where it can send data: its own
       files, plus GitHub's API for sync. Nothing else is reachable. Styles
       allow inline style attributes (used for bar widths). Any change to
       connect-src must be called out in the release notes. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131314">
  <!-- Dark app: let the page show behind the time and battery (Apple meta tag). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="A running work-time log for entering time into an office timesheet portal.">
  <meta name="apple-mobile-web-app-title" content="timeable">
  <title>timeable</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/timeable-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- The rainbow gradient for the press-and-hold ring (referenced from CSS). -->
  <svg class="svg-defs" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="rainbow-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285f4"/><stop offset="0.38" stop-color="#ea4335"/>
      <stop offset="0.66" stop-color="#fbbc04"/><stop offset="1" stop-color="#34a853"/>
    </linearGradient></defs></svg>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#desk" aria-label="timeable home">
        <img class="brand-mark" src="icons/icon-192.png" alt="" width="32" height="32">
        <span class="brand-word">timeable<span class="brand-dot">.</span></span>
      </a>
      <nav class="desktop-nav" aria-label="Main"></nav>
      <span class="topbar-date" id="today-label"></span>
    </header>
    <div class="banners" id="banners" aria-live="polite"></div>
    <main class="view" id="view" tabindex="-1"></main>
    <aside class="running" id="running" aria-label="On the clock" hidden></aside>
    <nav class="tabbar" aria-label="Main"></nav>
  </div>
  <noscript><p class="noscript">timeable needs JavaScript turned on.</p></noscript>
</body>
</html>
