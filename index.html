<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5866">
  <meta name="description" content="A running work-time log for entering time into an office timesheet portal.">
  <meta name="apple-mobile-web-app-title" content="timeable">
  <title>timeable</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#desk" aria-label="timeable home">
        <img class="brand-mark" src="icons/icon-192.png" alt="" width="32" height="32">
        <span class="brand-word">timeable<span class="brand-dot">.</span></span>
      </a>
      <nav class="desktop-nav" aria-label="Main"></nav>
      <span class="topbar-date" id="today-label"></span>
    </header>
    <div class="banners" id="banners" aria-live="polite"></div>
    <main class="view" id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Main"></nav>
  </div>
  <noscript><p class="noscript">timeable needs JavaScript turned on.</p></noscript>
</body>
</html>
