<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Google colors in the Work Hub order, flowing down the hourglass. -->
    <linearGradient id="rb" gradientUnits="userSpaceOnUse" x1="270" y1="290" x2="490" y2="740">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.38" stop-color="#EA4335"/>
      <stop offset="0.66" stop-color="#FBBC04"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <g id="mark" fill="none" stroke="url(#rb)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Hourglass outline: rounded top and bottom, pinched waist (from the original timeable icon). -->
      <path stroke-width="54" d="M322 292 H438 Q490 292 490 344 V372 C490 444 424 474 416 516 C424 558 490 588 490 660 V688 Q490 740 438 740 H322 Q270 740 270 688 V660 C270 588 336 558 344 516 C336 474 270 444 270 372 V344 Q270 292 322 292 Z"/>
      <!-- Sand in the top chamber, and two grains falling. -->
      <path fill="url(#rb)" stroke="none" d="M326 378 Q380 356 434 372 Q404 402 384 456 Q368 404 326 378 Z"/>
      <circle fill="url(#rb)" stroke="none" cx="380" cy="590" r="17"/>
      <circle fill="url(#rb)" stroke="none" cx="380" cy="640" r="22"/>
    </g>
    <!-- The "t", in bright white. -->
    <g id="t" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="66" d="M642 304 V636 Q642 712 716 712 H744"/>
      <path stroke-width="62" d="M578 430 H742"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="#131314"/>
  <use href="#mark" filter="url(#glow)" opacity="0.75"/>
  <use href="#t" filter="url(#glow)" opacity="0.4"/>
  <use href="#mark"/>
  <use href="#t"/>
</svg>
